<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <link rel="stylesheet" href="../../css/bai6b.css">
</head>

<body>
    <div id="khung">
        <div id="Head">
            <h1>Contact Us</h1>
        </div>

        <div id="selecter">
            <form action="">
                <fieldset>
                    <legend>Your message:</legend>

                    <table>
                        <tr>
                            <td>To</td>
                            <td><input type="text" name="to" id="To" value="Example CAFE"></td>
                        </tr>

                        <tr>
                            <td>Your Email</td>
                            <td><input type="text" name="mail" id="email"></td>
                        </tr>

                        <tr>
                            <td>Message</td>
                            <td><textarea name="mess" id="message"></textarea></td>
                        </tr>

                        <tr>
                            <td>Attrach File</td>
                            <td><input type="file" name="f" id="file"></td>

                        </tr>
                    </table>
                </fieldset>
            </form>
        </div>

        <div id="selecter1">
            <form action="">
                <fieldset>
                    <legend>How you found us:</legend>

                    <table>
                        <tr>
                            <td>How did you hear of us</td>
                            <td><select name="go" id="hear">
                                    <option value="Google">Google</option>
                                    <option value="CocCoc">CocCoc</option>
                                </select>
                            </td>
                        </tr>

                        <tr>
                            <td>Newsletter</td>
                            <td><input type="checkbox" name="chon" id="chon">Ensure this box is checked if you would
                                like to
                                receive email updates
                            </td>
                        </tr>
                    </table>
                </fieldset>
            </form>
        </div>
        <button type="button">Send message</button>
    </div>
</body>

</html>
