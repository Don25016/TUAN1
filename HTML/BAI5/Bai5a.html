<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Classic Movie Day</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0 auto;
        }

        #Day {
            margin-top: 200px;
            margin-bottom: 200px;
            font-family: 'Times New Roman', Times, serif;
        }

        table {
            border: 1px solid black;
            border-style: double;
            width: 800px;
        }

        th,td {
            border: 1px solid black;
            border-style: double;

        }

        .h {
            width: 10px;
        }

        caption {
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: normal;
        }
    </style>
</head>

<body>
    <div id="Day">
        <table>
            <Caption>
                Classic Movie Day
            </Caption>

            <tr>
                <th class="h">&nbsp;</th>
                <th> 5 pm</th>
                <th>7 pm</th>
                <th>9 pm</th>
                <th>11 pm</th>
            </tr>

            <tr>
                <th class="h">Screen one</th>
                <td>Start Wars</th>
                <td>Empire Strikes Back</td>
                <td>Return of the Jedi</td>
                <td>The Exorcist</td>
            </tr>
            <tr>
                <th class="h">Screen two</th>
                <td colspan="2">Dances with Wolves</td>
                <td colspan="2">Gone With the Wind</td>
            </tr>

            <tr>
                <th class="h">Screen three</th>
                <td colspan="2">2001: A Space Odyssey</td>
                <td>The Conversation</td>
                <td>5 Easy Pieces</td>
            </tr>
        </table>
    </div>
</body>

</html>
